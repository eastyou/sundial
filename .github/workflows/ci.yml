name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test sundial generation
        run: |
          python -m sundial --latitude 31.2 --start-hour 6 --end-hour 18 --title 日晷制作卡 -o sundial.html
          python -c 'text = open("sundial.html", encoding="utf-8").read(); assert text.count("data-page=") == 3; assert "160 mm" in text; assert "日晷制作卡" in text; print("smoke ok")'
